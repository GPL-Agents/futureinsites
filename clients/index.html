<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Area | FutureInSites</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark:#0B0C10; --accent:#2563EB; --cyan:#2DD4FF; --bg:#FFFFFF;
      --bg-alt:#F8F9FB; --border:#E4E7EE; --muted:#64748B;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body {
      font-family: var(--font); color: var(--dark); background:
        radial-gradient(900px 500px at 80% -10%, rgba(45,212,255,0.10), transparent 60%),
        radial-gradient(800px 500px at 10% 110%, rgba(37,99,235,0.10), transparent 60%),
        var(--bg-alt);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem; line-height: 1.6; text-align: center;
    }
    .card {
      max-width: 460px; background:#fff; border:1px solid var(--border);
      border-radius:18px; padding:2.8rem 2.4rem; box-shadow:0 20px 50px -24px rgba(11,12,16,0.25);
    }
    .icon {
      width:54px; height:54px; margin:0 auto 1.3rem; display:flex; align-items:center; justify-content:center;
      border-radius:14px; background:linear-gradient(135deg,#2DD4FF 0%,#2563EB 100%); color:#fff;
    }
    .wm { font-family:'Manrope',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:-0.025em; margin-bottom:0.8rem; }
    .wm .g { background:linear-gradient(90deg,#2DD4FF 0%,#2563EB 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
    h1 { font-family:'Manrope',sans-serif; font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:0.5rem; }
    p { color:var(--muted); font-size:0.97rem; }
    a.mail { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="wm">Future<span class="g">InSites</span></div>
    <h1>Private Client Area</h1>
    <p>Presentations here are available only by direct link. If you were given one, please use the exact URL and access code provided to you.</p>
    <p style="margin-top:1.2rem;">Need a hand? <a class="mail" href="mailto:hello@futureinsites.com">hello@futureinsites.com</a></p>
  </div>
</body>
</html>
