<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" preserveAspectRatio="xMidYMid slice" role="img" aria-label="FutureInSites: AI Strategy and Engineering">
  <defs>
    <pattern id="bGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="bGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="rgba(45,212,255,0.22)"/>
      <stop offset="65%" stop-color="rgba(45,212,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(45,212,255,0)"/>
    </radialGradient>
    <linearGradient id="bWord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1128" height="191" fill="#0B0C10"/>
  <rect width="1128" height="191" fill="url(#bGrid)"/>
  <ellipse cx="564" cy="100" rx="520" ry="130" fill="url(#bGlow)"/>

  <!-- wordmark -->
  <text x="564" y="90"
        font-family="Manrope, system-ui, sans-serif"
        font-size="58" font-weight="800"
        text-anchor="middle" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Future</tspan><tspan fill="url(#bWord)">InSites</tspan>
  </text>

  <!-- tagline -->
  <text x="564" y="138"
        font-family="Inter, system-ui, sans-serif"
        font-size="13" font-weight="500"
        text-anchor="middle" letter-spacing="7"
        fill="rgba(255,255,255,0.7)">AI STRATEGY  &amp;  ENGINEERING</text>

  <!-- hairline accents flanking the tagline -->
  <line x1="320" y1="134" x2="392" y2="134" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="736" y1="134" x2="808" y2="134" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
</svg>
>
