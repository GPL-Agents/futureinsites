<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" preserveAspectRatio="xMidYMid slice" role="img" aria-label="FutureInSites banner">
  <defs>
    <pattern id="bGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="bGlow" cx="62%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(45,212,255,0.18)"/>
      <stop offset="65%" stop-color="rgba(45,212,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(45,212,255,0)"/>
    </radialGradient>
    <linearGradient id="bWord" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#2DD4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="traceFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(45,212,255,0)"/>
      <stop offset="50%" stop-color="rgba(45,212,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(45,212,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1128" height="191" fill="#0B0C10"/>
  <rect width="1128" height="191" fill="url(#bGrid)"/>
  <ellipse cx="700" cy="76" rx="480" ry="130" fill="url(#bGlow)"/>

  <!-- circuit traces across visible width (engineering cue, faint) -->
  <g stroke="url(#traceFade)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 200 26 L 350 26 L 364 40 L 540 40"/>
    <path d="M 760 32 L 920 32 L 936 16 L 1080 16"/>
    <path d="M 240 162 L 420 162 L 436 178 L 600 178"/>
    <path d="M 700 172 L 880 172 L 896 156 L 1060 156"/>
  </g>
  <!-- node dots on the circuit traces -->
  <g fill="rgba(45,212,255,0.5)">
    <circle cx="364" cy="40" r="2"/>
    <circle cx="540" cy="40" r="2"/>
    <circle cx="936" cy="16" r="2"/>
    <circle cx="1080" cy="16" r="2"/>
    <circle cx="436" cy="178" r="2"/>
    <circle cx="600" cy="178" r="2"/>
    <circle cx="896" cy="156" r="2"/>
    <circle cx="1060" cy="156" r="2"/>
  </g>

  <!-- wordmark + tagline + sub-strap, centered in the visible (post-avatar) safe area -->
  <text x="700" y="76" font-family="Manrope, DejaVu Sans, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" text-anchor="middle" fill="url(#bWord)">FutureInSites</text>
  <text x="700" y="112" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" letter-spacing="0.4" text-anchor="middle" fill="rgba(255,255,255,0.78)">AI Strategy &amp; Digital Transformation</text>
  <text x="700" y="138" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" font-weight="500" font-style="italic" letter-spacing="0.5" text-anchor="middle" fill="rgba(45,212,255,0.78)">Build momentum. Fuel disruption. Drive ROI.</text>
</svg>
