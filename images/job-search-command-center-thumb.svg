<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Job Search Command Center control panel">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF2F6"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- panel background -->
  <rect width="560" height="440" rx="12" fill="url(#bgGrad)"/>

  <!-- panel header bar -->
  <rect x="0" y="0" width="560" height="48" rx="12" fill="#FFFFFF"/>
  <rect x="0" y="36" width="560" height="12" fill="#FFFFFF"/>
  <!-- header dots -->
  <circle cx="22" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="24" r="6" fill="#28C840"/>
  <!-- header title -->
  <text x="280" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Job Search Command Center</text>

  <!-- thin accent line under header -->
  <rect x="0" y="48" width="560" height="2" fill="url(#headerGrad)"/>

  <!-- === CARD ROW 1 === -->

  <!-- Card 1: Triage a role -->
  <rect x="20" y="68" width="163" height="100" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <!-- icon area -->
  <rect x="32" y="80" width="28" height="28" rx="6" fill="#EEF2FF"/>
  <!-- clipboard icon lines -->
  <rect x="38" y="87" width="16" height="2.5" rx="1.2" fill="#4F46E5"/>
  <rect x="38" y="93" width="11" height="2" rx="1" fill="#4F46E5" fill-opacity="0.5"/>
  <rect x="38" y="98" width="14" height="2" rx="1" fill="#4F46E5" fill-opacity="0.5"/>
  <!-- arrow badge -->
  <text x="164" y="83" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">↗</text>
  <text x="32" y="128" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Triage a role</text>
  <text x="32" y="144" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Score &amp; evaluate</text>
  <text x="32" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">a new JD</text>

  <!-- Card 2: Daily plan -->
  <rect x="199" y="68" width="163" height="100" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="211" y="80" width="28" height="28" rx="6" fill="#ECFDF5"/>
  <!-- calendar icon -->
  <rect x="217" y="84" width="16" height="14" rx="2" fill="none" stroke="#10B981" stroke-width="2"/>
  <rect x="217" y="84" width="16" height="5" rx="2" fill="#10B981"/>
  <text x="344" y="83" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">↗</text>
  <text x="211" y="128" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Daily plan</text>
  <text x="211" y="144" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Prioritized action</text>
  <text x="211" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">list</text>

  <!-- Card 3: Track an update -->
  <rect x="378" y="68" width="163" height="100" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="390" y="80" width="28" height="28" rx="6" fill="#FFF7ED"/>
  <!-- refresh icon (circle arrows) -->
  <path d="M 404 86 A 7 7 0 1 1 397 93" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <polygon points="397,89 397,93 401,93" fill="#F97316"/>
  <text x="523" y="83" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">↗</text>
  <text x="390" y="128" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Track an update</text>
  <text x="390" y="144" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Log status, interview,</text>
  <text x="390" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">or response</text>

  <!-- === CARD ROW 2 === -->

  <!-- Card 4: Draft outreach -->
  <rect x="20" y="184" width="163" height="100" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="32" y="196" width="28" height="28" rx="6" fill="#FDF4FF"/>
  <!-- send/paper plane icon -->
  <path d="M 38 214 L 54 206 L 46 218 Z" fill="none" stroke="#A855F7" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="46" y1="214" x2="46" y2="218" stroke="#A855F7" stroke-width="1.8" stroke-linecap="round"/>
  <text x="164" y="199" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">↗</text>
  <text x="32" y="244" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Draft outreach</text>
  <text x="32" y="260" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Cover letter,</text>
  <text x="32" y="273" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">follow-up, or note</text>

  <!-- Card 5: Refresh all -->
  <rect x="199" y="184" width="163" height="100" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="211" y="196" width="28" height="28" rx="6" fill="#F0FDF4"/>
  <!-- search/refresh icon -->
  <circle cx="225" cy="210" r="6" fill="none" stroke="#22C55E" stroke-width="2"/>
  <rect x="228" y="213" width="6" height="2" rx="1" transform="rotate(45 228 213)" fill="#22C55E"/>
  <text x="344" y="199" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">↗</text>
  <text x="211" y="244" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Refresh all</text>
  <text x="211" y="260" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Pipeline health</text>
  <text x="211" y="273" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">check</text>

  <!-- spinner hint bottom-left of row 2 area -->
  <circle cx="408" cy="234" r="14" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
  <path d="M 408 220 A 14 14 0 0 1 422 234" fill="none" stroke="url(#headerGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="260" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Using Claude...</text>

  <!-- bottom status bar -->
  <rect x="0" y="390" width="560" height="50" rx="0" fill="#FFFFFF"/>
  <rect x="0" y="390" width="560" height="1" fill="#E2E8F0"/>
  <rect x="0" y="428" width="560" height="12" rx="0" fill="#FFFFFF"/>
  <rect x="0" y="428" width="560" height="12" rx="12" fill="#FFFFFF"/>
  <!-- gradient pill -->
  <rect x="20" y="402" width="140" height="26" rx="13" fill="url(#headerGrad)" fill-opacity="0.12"/>
  <text x="90" y="419" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Job Search Command Center</text>
  <text x="540" y="419" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">FutureInSites</text>
</svg>
