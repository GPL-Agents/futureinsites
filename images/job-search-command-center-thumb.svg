<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Job Search Command Center: a scored job pipeline">
  <defs>
    <linearGradient id="jsccGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jsccBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <pattern id="jsccGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="jsccMask" cx="50%" cy="38%" r="62%">
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <mask id="jsccGridMask"><rect width="560" height="440" fill="url(#jsccMask)"/></mask>
  </defs>

  <!-- background -->
  <rect width="560" height="440" fill="#0E1320"/>
  <rect width="560" height="440" fill="url(#jsccGrid)" mask="url(#jsccGridMask)"/>
  <ellipse cx="280" cy="120" rx="320" ry="170" fill="url(#jsccGlow)"/>

  <!-- eyebrow label -->
  <text x="48" y="70" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#2DD4FF">JOB PIPELINE</text>

  <!-- pipeline rows: bar + score badge -->
  <!-- row 1 -->
  <rect x="48" y="110" width="464" height="58" rx="11" fill="#151B2A" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="68" y="128" width="150" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.78"/>
  <rect x="68" y="145" width="96" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.32"/>
  <circle cx="470" cy="139" r="22" fill="url(#jsccBadge)"/>
  <text x="470" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0B0C10">92</text>

  <!-- row 2 -->
  <rect x="48" y="186" width="464" height="58" rx="11" fill="#151B2A" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.4"/>
  <rect x="68" y="204" width="184" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="68" y="221" width="120" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="470" cy="215" r="22" fill="none" stroke="#2DD4FF" stroke-width="2.4"/>
  <text x="470" y="222" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#2DD4FF">78</text>

  <!-- row 3 -->
  <rect x="48" y="262" width="464" height="58" rx="11" fill="#151B2A" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.4"/>
  <rect x="68" y="280" width="138" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="68" y="297" width="104" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="470" cy="291" r="22" fill="none" stroke="#2563EB" stroke-width="2.4"/>
  <text x="470" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#7FA8FF">61</text>

  <!-- row 4 (faded, "pass") -->
  <rect x="48" y="338" width="464" height="58" rx="11" fill="#151B2A" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.4"/>
  <rect x="68" y="356" width="160" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="68" y="373" width="88" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <circle cx="470" cy="367" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.4"/>
  <text x="470" y="374" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" fill-opacity="0.4">43</text>
</svg>
